<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient)"/>
  
  <!-- Initials "SM" -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="280" font-weight="700" fill="#F3EDE2" text-anchor="middle" dominant-baseline="middle">SM</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C4A6F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3047;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
